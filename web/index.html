<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Maestri Wire — terminal</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
      body {
        background: #0c0c10;
        color: #d8d8e0;
        font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .app {
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      .bar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 6px 10px;
        border-bottom: 1px solid #26262f;
        background: #131318;
        white-space: nowrap;
      }
      .id {
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .status {
        flex: 1;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex: none;
      }
      .dot.connecting {
        background: #d0a020;
      }
      .dot.live {
        background: #30b060;
      }
      .dot.closed {
        background: #d04040;
      }
      .fit {
        display: flex;
        align-items: center;
        gap: 4px;
        cursor: pointer;
      }
      .term {
        flex: 1;
        min-height: 0;
        padding: 4px 0 0 6px;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
