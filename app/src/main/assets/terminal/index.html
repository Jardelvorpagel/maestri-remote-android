<!doctype html>
<!--
  Terminal face renderer: xterm.js on a local asset, fed by the app's TerminalStreamSocket
  through TermBridge (raw PTY bytes as base64, ordered and coalesced on the Kotlin side).
  No network, no dev server, no token: the page only ever sees frame bytes and the terminal
  id, so a compromised page cannot leak a credential it never receives.

  Geometry: the box is the authority. The page boots fitted — one resize to the measured
  grid after the host has said it supports resizing — so nothing is ever clipped or left
  empty on a phone. "ajustar" toggles to "grade do host" for a 1:1 look at the real layout,
  which sends nothing. A host without terminalResize keeps its grid verbatim and the app
  shows the col-cap notice.
-->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="stylesheet" href="vendor/xterm.css">
<style>
  :root {
    --bg: #1a1b26; --ink: #a9b1d6; --dim: #565f89;
    --live: #9ece6a; --warn: #e0af68; --err: #f7768e; --accent: #7aa2f7;
  }
  html, body { margin: 0; padding: 0; background: var(--bg); overflow: hidden; }
  /* WebView on Android reports vh/percentage heights as 0; a fixed shell still measures. */
  #shell {
    position: fixed; top: 0; right: 0; bottom: 0; left: 0;
    display: flex; flex-direction: column; overflow: hidden;
  }
  #hud {
    flex: 0 0 auto; display: flex; align-items: center; gap: 7px;
    padding: 5px 8px 3px; font: 11px/1.4 monospace; color: var(--dim);
  }
  #dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); flex: 0 0 auto; }
  #dot.live { background: var(--live); }
  #dot.connecting { background: var(--warn); }
  #dot.closed { background: var(--err); }
  #id { color: var(--ink); letter-spacing: .04em; }
  #state { flex: 1 1 auto; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .btn {
    flex: 0 0 auto; background: transparent; border: 0; color: #7aa2f7;
    box-shadow: 0 0 0 1px rgba(122,162,247,.5) inset;
    border-radius: 9px; font: 500 11.5px system-ui, sans-serif; padding: 5px 12px;
  }
  .btn.on { box-shadow: 0 0 0 1px rgba(122,162,247,.5) inset; color: #7aa2f7; background: rgba(122,162,247,.12); }
  #term { position: relative; flex: 1 1 auto; min-height: 0; margin: 0 6px 6px; overflow: hidden; touch-action: none; }
  #copied {
    position: absolute; right: 14px; bottom: 10px; color: var(--ink); background: #24283bcc;
    font: 12px monospace; padding: 4px 10px; border-radius: 8px; opacity: 0;
    transition: opacity .25s; pointer-events: none; z-index: 5;
  }
</style>
</head>
<body>
<div id="shell">
<div id="hud">
  <span id="dot"></span>
  <span id="id">terminal</span>
  <span id="state">conectando…</span>
  <button id="fit" class="btn on" type="button">ajustar</button>
  <button id="copy" class="btn" type="button">copiar</button>
</div>
<div id="term"></div>
<div id="copied">copiado</div>
</div>
<script src="vendor/xterm.js"></script>
<script src="vendor/xterm-fit.js"></script>
<script>
(function () {
  "use strict";

  var THEME = {
    background: "#1a1b26", foreground: "#a9b1d6",
    cursor: "#a9b1d6", cursorAccent: "#1a1b26",
    black: "#1a1b26", red: "#f7768e", green: "#9ece6a", yellow: "#e0af68",
    blue: "#7aa2f7", magenta: "#bb9af7", cyan: "#7dcfff", white: "#a9b1d6",
    brightBlack: "#565f89", brightRed: "#f7768e", brightGreen: "#9ece6a",
    brightYellow: "#e0af68", brightBlue: "#7aa2f7", brightMagenta: "#bb9af7",
    brightCyan: "#7dcfff", brightWhite: "#c0caf5"
  };

  var term = null, fit = null, ready = false;
  // MODE "fit" (default): the box is the authority and the PTY is refit to it.
  // MODE "host": 1:1 mirror of the host grid, nothing is ever sent.
  var MODE = "fit", HOST = null, CAN_REFIT = true, KNOWN = false, lastSent = null;
  var fitTimer = null;

  function el(id) { return document.getElementById(id); }
  function sane(c, r) { return c >= 20 && c <= 250 && r >= 5 && r <= 120; }
  function same(g, c, r) { return !!g && g.cols === c && g.rows === r; }

  function sendResize(cols, rows) {
    if (!window.TermBridge) return;
    // KNOWN means __set_host already told us whether this host can resize at all.
    if (!KNOWN || !CAN_REFIT || !sane(cols, rows) || same(lastSent, cols, rows)) return;
    window.TermBridge.sendResize(cols, rows);
    lastSent = { cols: cols, rows: rows };
  }

  // Cross-check only: the fit addon measures with the real renderer, so its proposal is the
  // authority. Glyph width is derived from rendered rows and exists only when there is text —
  // null means "nothing to cross-check", never "abort the fit" (an empty terminal still fits).
  function measure() {
    if (!term || !term.cols || !term.rows) return null;
    var box = el("term").getBoundingClientRect();
    // 120 CSS px is ~8 rows: the IME leaves little, but a box that small is still a terminal.
    if (!(box.width >= 240 && box.height >= 120)) return null;
    var rows = el("term").querySelector(".xterm-rows");
    if (!rows || !rows.children.length) return null;
    var cellW = 0, cellH = 0;
    for (var i = 0; i < rows.children.length && i < 12; i++) {
      var div = rows.children[i];
      var text = div.textContent || "";
      var h = div.getBoundingClientRect().height;
      if (h > 0 && !cellH) cellH = h;
      // ASCII only: a CJK/emoji cell is two advances wide and would inflate the average.
      if (text.trim().length < 10 || /[^\x20-\x7e]/.test(text)) continue;
      var rg = document.createRange();
      rg.selectNodeContents(div);
      var w = rg.getBoundingClientRect().width;
      if (w > 0) {
        var c = w / text.length;
        if (c > 0 && (cellW === 0 || c < cellW)) cellW = c;
      }
    }
    if (!(cellW > 0 && cellH > 0)) return null;
    return { box: box, cellW: cellW, cellH: cellH };
  }

  // Fit to the box; the glyph cross-check can only veto, never block a fit that has no text.
  function fitBox(send) {
    if (!term || !fit || !ready) return;
    var box = el("term").getBoundingClientRect();
    if (!(box.width >= 240 && box.height >= 120)) return;
    var d = fit.proposeDimensions();
    if (!d || !d.cols || !d.rows || !sane(d.cols, d.rows)) return;
    var m = measure();
    if (m && (d.cols * m.cellW > m.box.width + 0.5 || d.rows * m.cellH > m.box.height + 0.5)) return;
    term.resize(d.cols, d.rows);
    if (send) sendResize(d.cols, d.rows);
  }

  function mirrorHost() {
    if (!term || !HOST) return;
    term.resize(HOST.cols, HOST.rows);
  }

  function applyMode(send) {
    if (MODE === "host" || !CAN_REFIT) mirrorHost();
    else fitBox(send);
  }

  function setMode(next) {
    MODE = next;
    el("fit").textContent = MODE === "fit" ? "ajustar" : "grade do host";
    el("fit").classList.toggle("on", MODE === "fit");
    applyMode(true);
  }

  // Layout churn (IME animation, rotation) produces a burst of box sizes; only the settled
  // one is worth a resize frame.
  function scheduleFit() {
    if (MODE !== "fit" || !CAN_REFIT || !KNOWN) return;
    clearTimeout(fitTimer);
    fitTimer = setTimeout(function () {
      var atTail = !term || term.buffer.active.viewportY >= term.buffer.active.baseY;
      fitBox(true);
      // Never steal the viewport from someone reading history.
      if (atTail && term) term.scrollToBottom();
    }, 120);
  }

  // A frame is not a layout signal: under continuous streaming a debounced fit would never
  // run. Only a genuinely new box size gets an unsent local fit.
  var boxSig = "";
  function fitIfBoxChanged() {
    if (MODE !== "fit" || !CAN_REFIT || !KNOWN || !term) return;
    var b = el("term").getBoundingClientRect();
    if (b.width < 240 || b.height < 120) return;
    var sig = Math.round(b.width) + "x" + Math.round(b.height);
    if (sig === boxSig) return;
    boxSig = sig;
    fitBox(false);
  }

  function boot() {
    term = new window.Terminal({
      scrollback: 5000,
      fontSize: 13,
      fontFamily: "monospace",
      theme: Object.assign({}, THEME),
      allowProposedApi: true
    });
    fit = new window.FitAddon.FitAddon();
    term.loadAddon(fit);
    term.open(el("term"));

    term.onData(function (data) {
      if (window.TermBridge) window.TermBridge.sendInput(data);
    });

    el("fit").addEventListener("click", function () {
      setMode(MODE === "fit" ? "host" : "fit");
    });
    el("copy").addEventListener("click", function () { window.__copyScreen(); });

    // A drag must move the BUFFER, not the DOM scrollTop. xterm renders from
    // buffer.ydisp and re-syncs scrollTop from it (syncScrollArea), so writing
    // scrollTop directly is snapped back and a full-screen drag moved one line.
    // term.scrollLines(amount, suppress, 1) is the path xterm itself uses to move
    // the buffer: ydisp moves, the rows re-render, and the scrollbar follows.
    // The host TUI keeps mouse reporting on, which switches off xterm's own touch
    // gesture handling, so this handler stays; the browser cannot do it either
    // (the touch lands on .xterm-screen, a sibling of the scrolling .xterm-viewport).
    var touchY = null;
    el("term").addEventListener("touchstart", function (e) {
      touchY = e.touches.length === 1 ? e.touches[0].clientY : null;
    }, { passive: true, capture: true });
    // The page does NOT scroll on touch. Scrolling the terminal buffer from inside a
    // touchmove handler truncates Chromium's touch stream: on the OPPO 68 MotionEvents
    // reach the WebView, but only 2 reach the page once the handler scrolls, so a drag
    // moves the terminal by a single line. The page only refuses the browser's own
    // scrolling; the drag itself is driven from the Android side, which sees the whole
    // stream, through window.__scrollTerminal() below.
    el("term").addEventListener("touchmove", function (e) {
      if (touchY === null || e.touches.length !== 1) return;
      touchY = e.touches[0].clientY;
      e.preventDefault();
    }, { passive: false, capture: true });
    el("term").addEventListener("touchend", function () { touchY = null; }, { passive: true, capture: true });

    new ResizeObserver(scheduleFit).observe(el("term"));
    if (window.visualViewport) window.visualViewport.addEventListener("resize", scheduleFit);
    window.addEventListener("resize", scheduleFit);

    ready = true;
    if (window.TermBridge && window.TermBridge.rendererReady) window.TermBridge.rendererReady();
  }

  // Called by the Android side with the finger's travel in device px (positive = the
  // finger moved DOWN = going back through history). It moves the BUFFER, not the DOM
  // scroll: term.scrollLines(amount, suppress, 1) is the path xterm itself uses
  // (viewport.onRequestScrollLines -> scrollLines(amount, suppress, 1)), so ydisp
  // moves, the rows re-render, and the scrollbar follows. A negative amount walks
  // towards older content, which is what a downward drag means.
  //
  // The sub-line remainder is kept HERE: the Android side pushes the drag in small
  // slices and each slice is usually shorter than one line, so the residue has to
  // survive between pushes or the terminal never moves.
  var scrollRemainder = 0;
  var wheelRows = 0;
  window.__scrollCalls = 0;
  window.__terminalMouseMode = function () {
    try { return term ? term.modes.mouseTrackingMode : "no-term"; } catch (e) { return "err:" + e; }
  };
  window.__scrollTerminal = function (deltaDevicePx) {
    if (!term || !deltaDevicePx) return;
    window.__scrollCalls++;
    var row = el("term").querySelector(".xterm-rows>div");
    var lh = row ? row.getBoundingClientRect().height : 16;
    var dpr = window.devicePixelRatio || 1;
    var css = deltaDevicePx / dpr + scrollRemainder;
    var n = Math.trunc(css / lh);
    if (!n) { scrollRemainder = css; return; }
    scrollRemainder = css - n * lh;
    // A program that turned mouse reporting on (a full-screen TUI) keeps its own
    // history and scrolls it with the MOUSE WHEEL: xterm turns the wheel into SGR
    // mouse bytes on the wire and the TUI scrolls itself. A phone has no wheel, so
    // the finger drag has to become one -- byte for byte what a mouse wheel would
    // produce, which is why it behaves exactly like the browser mirror.
    var mouseMode = term.modes && term.modes.mouseTrackingMode;
    if (mouseMode && mouseMode !== "none") {
      // SGR: 64 = wheel up (older content), 65 = wheel down. A finger dragged DOWN
      // pulls the content down, which is the same as a wheel UP: it walks back
      // through the history.
      //
      // The host multiplies every wheel event by 5 rows (pi's
      // ALT_WHEEL_SCROLL_MULTIPLIER with wheelScrollLines=1), so one event per FIVE
      // finger rows is what makes the content move 1:1 with the finger. Emitting one
      // event per finger row would scroll five times too fast.
      wheelRows += n;
      var events = Math.trunc(wheelRows / 5);
      if (!events) return;
      wheelRows -= events * 5;
      var button = events > 0 ? 64 : 65;
      window.__wheelSends = (window.__wheelSends || 0) + Math.abs(events);
      for (var i = 0; i < Math.abs(events); i++) {
        window.TermBridge.sendInput("\u001b[<" + button + ";10;10M");
      }
      return;
    }
    // No mouse reporting: the terminal's own scrollback is the thing to move.
    term.scrollLines(-n, false, 1);
  };

  window.__pushFrames = function (b64frames) {
    if (!term) return;
    var chunks = [];
    for (var i = 0; i < b64frames.length; i++) {
      var bin = window.atob(b64frames[i]);
      var u8 = new Uint8Array(bin.length);
      for (var j = 0; j < bin.length; j++) u8[j] = bin.charCodeAt(j);
      chunks.push(u8);
    }
    var total = chunks.length;
    if (!total) return;
    // One write per batch, acknowledged to Kotlin: the next batch only leaves after the
    // renderer consumed this one, so a flood cannot pile up inside the JS buffer.
    var merged = new Uint8Array(chunks.reduce(function (n, c) { return n + c.length; }, 0));
    var at = 0;
    for (var k = 0; k < total; k++) { merged.set(chunks[k], at); at += chunks[k].length; }
    term.write(merged, function () {
      if (window.TermBridge && window.TermBridge.framesConsumed) {
        window.TermBridge.framesConsumed(total);
      }
      fitIfBoxChanged();
    });
  };

  window.__init = function (cfg) {
    if (!term) boot();
    if (cfg.id) el("id").textContent = String(cfg.id).slice(0, 8).toUpperCase();
    if (cfg.fontSize) term.options.fontSize = cfg.fontSize;
    if (cfg.theme) term.options.theme = Object.assign({}, THEME, cfg.theme);
    scheduleFit();
  };

  window.__set_host = function (cols, rows, canRefit) {
    try {
      if (!term) boot();
      CAN_REFIT = !!canRefit;
      var known = cols > 0 && rows > 0;
      if (known) {
        HOST = { cols: cols, rows: rows };
        // The protocol guarantees a geometry frame is always followed by a new screen: drop
        // what is on screen so a reconnect cannot stack a snapshot on top of the old buffer.
        term.reset();
      }
      KNOWN = true;
      if (MODE === "fit" && CAN_REFIT) {
        // Host clamped or ignored our grid (20..250 x 5..120): adopt what it actually runs
        // instead of deduping ourselves into a permanent desync.
        if (known && lastSent && !same(lastSent, cols, rows)) mirrorHost();
        else fitBox(true);
      } else {
        mirrorHost();
      }
    } finally {
      // The stream queue waits on this ack: a thrown error must not freeze the face.
      if (window.TermBridge && window.TermBridge.hostApplied) window.TermBridge.hostApplied();
    }
  };

  window.__set_status = function (state) {
    // A reconnect restores whatever grid the host had; forget what we sent so the next live
    // geometry re-sends the box grid instead of being deduped away.
    if (state !== "live") lastSent = null;
    var text = { live: "ao vivo", connecting: "conectando…", closed: "encerrado", idle: "parado" };
    el("dot").className = state;
    el("state").textContent = text[state] || state;
  };

  window.__copyScreen = function () {
    if (!term) return;
    var text = term.getSelection();
    if (!text) {
      var buf = term.buffer.active, lines = [];
      for (var y = 0; y < term.rows; y++) {
        var line = buf.getLine(buf.viewportY + y);
        lines.push(line ? line.translateToString(true) : "");
      }
      text = lines.join("\n");
    }
    if (text && window.TermBridge) window.TermBridge.copy(text);
  };

  window.__showCopied = function () {
    var chip = el("copied");
    chip.style.opacity = 1;
    setTimeout(function () { chip.style.opacity = 0; }, 900);
  };

  if (document.readyState === "loading") {
    window.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
