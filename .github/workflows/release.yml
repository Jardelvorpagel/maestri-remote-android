name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  BASE_VERSION: "0.2.1"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for version derivation)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Assert signing secrets present
        run: |
          missing=0
          for s in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!s:-}" ]; then echo "::error::Missing required secret: $s"; missing=1; fi
          done
          if [ "$missing" = "1" ]; then
            echo "::error::Release refuses to sign with any other key. Configure the four ANDROID_* secrets."
            exit 1
          fi
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Decode keystore
        run: |
          echo "::add-mask::${ANDROID_KEYSTORE_PASSWORD}"
          echo "::add-mask::${ANDROID_KEY_PASSWORD}"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Derive deterministic version
        run: |
          CODE=$(git rev-list --count HEAD)
          SHA=$(git rev-parse --short HEAD)
          NAME="${BASE_VERSION}-${SHA}"
          printf 'versionCode=%s\nversionName=%s\n' "$CODE" "$NAME" > version.properties
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "VERSION_SHA=$SHA" >> "$GITHUB_ENV"
          cat version.properties

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Hash APK and write latest.json
        run: |
          set -e
          SRC="app/build/outputs/apk/release/app-release.apk"
          ASSET="maestri-remote-${VERSION_SHA}.apk"
          cp "$SRC" "$ASSET"
          SHA256=$(sha256sum "$ASSET" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$ASSET")
          NOTES=$(git log -1 --format=%s)
          PUBLISHED=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"
          python3 - "$VERSION_CODE" "$VERSION_NAME" "$VERSION_SHA" "$SHA256" "$SIZE" "$PUBLISHED" "$NOTES" <<'EOF'
          import json, sys
          code, name, sha, digest, size, published, notes = sys.argv[1:8]
          tag = "v" + name
          doc = {
              "versionCode": int(code),
              "versionName": name,
              "apkUrl": f"https://github.com/Jardelvorpagel/maestri-remote-android/releases/download/{tag}/maestri-remote-{sha}.apk",
              "sha256": digest,
              "size": int(size),
              "publishedAt": published,
              "notes": notes,
          }
          with open("latest.json", "w") as f:
              json.dump(doc, f, indent=2)
          print(open("latest.json").read())
          EOF

      - name: Publish GitHub Release (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="v${VERSION_NAME}"
          NOTES=$(git log -1 --format=%s)
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG exists — uploading assets with --clobber."
          else
            gh release create "$TAG" --title "$TAG" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" "$ASSET" latest.json --clobber
